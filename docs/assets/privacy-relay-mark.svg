<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title description">
  <title id="title">IPI Payment Relay</title>
  <desc id="description">Zanonimizowana postać z twarzą ukrytą za mozaiką, otoczona pięcioma przekaźnikami płatności.</desc>
  <defs>
    <linearGradient id="background" x1="68" y1="42" x2="449" y2="474" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1b303b"/>
      <stop offset=".43" stop-color="#0b151b"/>
      <stop offset="1" stop-color="#04080b"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="43%" r="58%">
      <stop stop-color="#f95061" stop-opacity=".19"/>
      <stop offset=".58" stop-color="#81283a" stop-opacity=".045"/>
      <stop offset="1" stop-color="#061014" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hood" x1="168" y1="145" x2="351" y2="392" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2b4a57"/>
      <stop offset=".5" stop-color="#142831"/>
      <stop offset="1" stop-color="#081116"/>
    </linearGradient>
    <linearGradient id="face" x1="218" y1="197" x2="299" y2="323" gradientUnits="userSpaceOnUse">
      <stop stop-color="#aec7be"/>
      <stop offset=".48" stop-color="#668177"/>
      <stop offset="1" stop-color="#263d3b"/>
    </linearGradient>
    <linearGradient id="shoulders" x1="116" y1="345" x2="390" y2="432" gradientUnits="userSpaceOnUse">
      <stop stop-color="#101f26"/>
      <stop offset=".5" stop-color="#294956"/>
      <stop offset="1" stop-color="#101f26"/>
    </linearGradient>
    <linearGradient id="relay" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#96f9c1"/>
      <stop offset="1" stop-color="#2bac78"/>
    </linearGradient>
    <pattern id="grid" width="22" height="22" patternUnits="userSpaceOnUse">
      <path d="M22 0H0V22" fill="none" stroke="#90ffd0" stroke-width="1" stroke-opacity=".045"/>
    </pattern>
    <clipPath id="portrait">
      <circle cx="256" cy="268" r="152"/>
    </clipPath>
    <filter id="shadow" x="-35%" y="-35%" width="170%" height="190%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000" flood-opacity=".72"/>
    </filter>
    <filter id="glow" x="-140%" y="-140%" width="380%" height="380%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect x="13" y="13" width="486" height="486" rx="106" fill="url(#background)"/>
  <rect x="14.5" y="14.5" width="483" height="483" rx="104.5" fill="none" stroke="#49636e" stroke-opacity=".5" stroke-width="3"/>
  <rect x="14" y="14" width="484" height="484" rx="105" fill="url(#grid)"/>
  <circle cx="256" cy="239" r="208" fill="url(#halo)"/>
  <path d="M79 111C142 47 246 28 344 65" fill="none" stroke="#d5fff0" stroke-opacity=".09" stroke-width="3" stroke-linecap="round"/>

  <g fill="none" stroke="#68ecaa" stroke-width="4" stroke-linecap="round" stroke-dasharray="3 13" opacity=".42">
    <path d="M256 83c67 0 121 34 158 91"/>
    <path d="M414 174c27 54 18 126-18 182"/>
    <path d="M396 356c-61 57-207 59-280-2"/>
    <path d="M116 354c-38-47-41-124-16-173"/>
    <path d="M100 181c35-63 91-95 156-98"/>
  </g>

  <g filter="url(#shadow)">
    <circle cx="256" cy="268" r="160" fill="#050a0d" stroke="#324b55" stroke-width="6"/>
    <g clip-path="url(#portrait)">
      <circle cx="256" cy="268" r="152" fill="#0a151b"/>
      <path d="M114 437c9-69 51-104 105-119h74c54 15 97 50 105 119Z" fill="url(#shoulders)"/>
      <path d="M174 341c-11-36-7-118 9-155 16-38 41-61 73-61s58 23 74 61c16 37 20 119 8 155l-45-24h-74Z" fill="url(#hood)" stroke="#42616c" stroke-width="5"/>
      <path d="M215 224c6-37 22-58 41-58 20 0 36 21 42 58l-7 63c-5 32-18 50-35 50s-30-18-35-50Z" fill="url(#face)"/>
      <path d="M192 348c25-15 39-25 49-41M320 348c-25-15-39-25-49-41" fill="none" stroke="#52717b" stroke-width="5" stroke-linecap="round" opacity=".6"/>

      <g>
        <rect x="193" y="224" width="126" height="72" rx="10" fill="#071014" stroke="#f65965" stroke-width="3"/>
        <rect x="201" y="232" width="24" height="19" fill="#f05562"/>
        <rect x="225" y="232" width="17" height="19" fill="#273e46"/>
        <rect x="242" y="232" width="31" height="19" fill="#87eab3"/>
        <rect x="273" y="232" width="18" height="19" fill="#172a31"/>
        <rect x="291" y="232" width="20" height="19" fill="#d84555"/>
        <rect x="201" y="251" width="16" height="18" fill="#20373f"/>
        <rect x="217" y="251" width="30" height="18" fill="#64c796"/>
        <rect x="247" y="251" width="18" height="18" fill="#f0636e"/>
        <rect x="265" y="251" width="27" height="18" fill="#334d54"/>
        <rect x="292" y="251" width="19" height="18" fill="#93e7b8"/>
        <rect x="201" y="269" width="27" height="19" fill="#72d9a4"/>
        <rect x="228" y="269" width="20" height="19" fill="#f35c68"/>
        <rect x="248" y="269" width="32" height="19" fill="#1c3239"/>
        <rect x="280" y="269" width="15" height="19" fill="#df4757"/>
        <rect x="295" y="269" width="16" height="19" fill="#426a64"/>
        <path d="M203 216h41M279 304h30" stroke="#ff7280" stroke-width="4" stroke-linecap="round" opacity=".8"/>
      </g>
    </g>
    <circle cx="256" cy="268" r="152" fill="none" stroke="#bfffe0" stroke-opacity=".1" stroke-width="2"/>
  </g>

  <g filter="url(#glow)">
    <g transform="translate(256 83)">
      <circle r="19" fill="#071014" stroke="#61dba0" stroke-width="4"/>
      <circle r="7" fill="url(#relay)"/>
    </g>
    <g transform="translate(414 174)">
      <circle r="19" fill="#071014" stroke="#61dba0" stroke-width="4"/>
      <circle r="7" fill="url(#relay)"/>
    </g>
    <g transform="translate(396 356)">
      <circle r="19" fill="#071014" stroke="#61dba0" stroke-width="4"/>
      <circle r="7" fill="url(#relay)"/>
    </g>
    <g transform="translate(116 354)">
      <circle r="19" fill="#071014" stroke="#61dba0" stroke-width="4"/>
      <circle r="7" fill="url(#relay)"/>
    </g>
    <g transform="translate(100 181)">
      <circle r="19" fill="#071014" stroke="#61dba0" stroke-width="4"/>
      <circle r="7" fill="url(#relay)"/>
    </g>
  </g>

  <path d="M178 456h156" stroke="#5d7c79" stroke-width="4" stroke-linecap="round" opacity=".33"/>
  <path d="M217 456h78" stroke="#f2616d" stroke-width="4" stroke-linecap="round" opacity=".76"/>
</svg>
