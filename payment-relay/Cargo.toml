[package]
name = "ipi-payment-relay"
version = "0.1.0"
edition = "2021"
license-file = "../LICENSE"
description = "Transparent zero-retention payment relay for IPI Card Vault"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
library = []

[profile.release]
opt-level = 3
debug = false
rpath = false
lto = true
debug-assertions = false
codegen-units = 1
panic = "abort"
incremental = false
overflow-checks = true

[dependencies]
cosmwasm-schema = "2.2.0"
cosmwasm-std = { version = "2.2.0", features = ["cosmwasm_2_0"] }
cw-storage-plus = "2.0.0"
cw2 = "2.0.0"
thiserror = "1.0.58"

[dev-dependencies]
cw-multi-test = "2.0.0"
