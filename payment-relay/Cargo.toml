[package]
name = "ipi-payment-relay"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Transparent zero-retention payment relay for IPI Card Vault"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
library = []

[dependencies]
cosmwasm-schema = "2.2.0"
cosmwasm-std = { version = "2.2.0", features = ["cosmwasm_2_0"] }
cw-storage-plus = "2.0.0"
cw2 = "2.0.0"
thiserror = "1.0.58"

[dev-dependencies]
cw-multi-test = "2.0.0"
