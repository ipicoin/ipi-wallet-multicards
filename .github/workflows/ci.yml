name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - run: rustup toolchain install 1.85.0 --profile minimal --target wasm32-unknown-unknown --component rustfmt,clippy
      - run: cargo +1.85.0 fmt -- --check
      - run: cargo +1.85.0 clippy --locked --all-targets -- -D warnings
      - run: cargo +1.85.0 test --locked
      - run: cargo +1.85.0 build --locked --release --target wasm32-unknown-unknown
      - name: Verify tracked Wasm checksum
        working-directory: artifacts
        run: sha256sum --check checksums.txt
      - name: Reproduce optimized Wasm
        run: |
          docker run --rm -v "$PWD":/code \
            --mount type=volume,source=ipi_card_vault_cache,target=/target \
            --mount type=volume,source=ipi_cosmwasm_registry_cache,target=/usr/local/cargo/registry \
            cosmwasm/optimizer:0.16.1
      - name: Verify reproduced Wasm checksum
        working-directory: artifacts
        run: sha256sum --check checksums.txt
      - run: git diff --exit-code -- artifacts/
