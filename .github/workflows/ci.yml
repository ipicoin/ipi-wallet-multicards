name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - run: rustup toolchain install 1.85.0 --profile minimal --target wasm32-unknown-unknown --component rustfmt,clippy
      - run: cargo +1.85.0 fmt -- --check
      - run: cargo +1.85.0 clippy --locked --all-targets -- -D warnings
      - run: cargo +1.85.0 test --locked
      - run: cargo +1.85.0 build --locked --release --target wasm32-unknown-unknown
      - run: cargo +1.85.0 fmt --manifest-path payment-relay/Cargo.toml -- --check
      - run: cargo +1.85.0 clippy --manifest-path payment-relay/Cargo.toml --locked --all-targets -- -D warnings
      - run: cargo +1.85.0 test --manifest-path payment-relay/Cargo.toml --locked
      - run: cargo +1.85.0 build --manifest-path payment-relay/Cargo.toml --locked --release --target wasm32-unknown-unknown
      - name: Verify tracked Wasm checksum
        working-directory: artifacts
        run: sha256sum --check checksums.txt
      - name: Reproduce optimized Wasm
        run: |
          docker run --rm --entrypoint sh -v "$PWD":/code \
            --mount type=volume,source=ipi_card_vault_cache,target=/target \
            --mount type=volume,source=ipi_cosmwasm_registry_cache,target=/usr/local/cargo/registry \
            --mount type=volume,source=ipi_optimizer_rustup,target=/usr/local/rustup \
            cosmwasm/optimizer:0.16.1 -c \
            'rustup toolchain install 1.85.0-x86_64-unknown-linux-musl --profile minimal --target wasm32-unknown-unknown && rustup default 1.85.0-x86_64-unknown-linux-musl && cd /code && /usr/local/bin/optimize.sh .'
      - name: Verify reproduced Wasm checksum
        working-directory: artifacts
        run: sha256sum --check checksums.txt
      - run: git diff --exit-code -- artifacts/
      - name: Verify tracked Payment Relay Wasm checksum
        working-directory: payment-relay/artifacts
        run: sha256sum --check checksums.txt
      - name: Reproduce optimized Payment Relay Wasm
        working-directory: payment-relay
        run: |
          docker run --rm --entrypoint sh -v "$PWD":/code \
            --mount type=volume,source=ipi_payment_relay_cache,target=/target \
            --mount type=volume,source=ipi_payment_relay_registry_cache,target=/usr/local/cargo/registry \
            --mount type=volume,source=ipi_optimizer_rustup,target=/usr/local/rustup \
            cosmwasm/optimizer:0.16.1 -c \
            'rustup toolchain install 1.85.0-x86_64-unknown-linux-musl --profile minimal --target wasm32-unknown-unknown && rustup default 1.85.0-x86_64-unknown-linux-musl && cd /code && /usr/local/bin/optimize.sh .'
      - name: Verify reproduced Payment Relay Wasm checksum
        working-directory: payment-relay/artifacts
        run: sha256sum --check checksums.txt
      - run: git diff --exit-code -- payment-relay/artifacts/
