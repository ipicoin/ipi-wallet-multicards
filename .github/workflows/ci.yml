name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - run: rustup toolchain install 1.85.0 --profile minimal --target wasm32-unknown-unknown --component rustfmt,clippy
      - run: cargo +1.85.0 fmt --all -- --check
      - run: cargo +1.85.0 clippy --workspace --locked --all-targets -- -D warnings
      - run: cargo +1.85.0 test --workspace --locked
      - run: cargo +1.85.0 build --workspace --locked --release --target wasm32-unknown-unknown
      - name: Verify tracked Card Vault Wasm checksum
        working-directory: contracts/multicarding
        run: sha256sum --check checksums.txt
      - name: Verify tracked Payment Relay Wasm checksum
        working-directory: contracts/anonymization
        run: sha256sum --check checksums.txt
      - name: Reproduce optimized contract Wasm files
        run: |
          docker run --rm --entrypoint sh -v "$PWD":/code \
            --mount type=volume,source=ipi_contracts_cache,target=/target \
            --mount type=volume,source=ipi_cosmwasm_registry_cache,target=/usr/local/cargo/registry \
            --mount type=volume,source=ipi_optimizer_rustup,target=/usr/local/rustup \
            cosmwasm/optimizer:0.16.1 -c \
            'rustup toolchain install 1.85.0-x86_64-unknown-linux-musl --profile minimal --target wasm32-unknown-unknown && rustup default 1.85.0-x86_64-unknown-linux-musl && cd /code && /usr/local/bin/optimize.sh .'
      - name: Compare reproduced Card Vault Wasm
        run: cmp artifacts/ipi_card_vault.wasm contracts/multicarding/ipi_card_vault.wasm
      - name: Compare reproduced Payment Relay Wasm
        run: cmp artifacts/ipi_payment_relay.wasm contracts/anonymization/ipi_payment_relay.wasm
